name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install (root, server, client)
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix client ci

      - name: Lint
        run: npm run lint

      - name: Server tests
        run: npm --prefix server test

      - name: Client build
        run: npm --prefix client run build

      # Fails the build on a *production* vulnerability only. Dev-only findings
      # (vite/esbuild dev-server advisories) don't ship and shouldn't block a deploy.
      - name: Audit production dependencies
        run: |
          npm --prefix server audit --omit=dev --audit-level=high
          npm --prefix client audit --omit=dev --audit-level=high
