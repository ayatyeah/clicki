# DigitalOcean App Platform spec — CLICKI (single service)
# One Node web service builds the React client and serves it + the API.
# DO auto-detects this file when creating an app from the repo.
name: clicki
region: fra

services:
  - name: clicki
    github:
      repo: ayatyeah/clicki
      branch: main
      deploy_on_push: true
    # Root of the repo — root package.json build/start orchestrate client+server
    build_command: npm run build
    run_command: npm start
    environment_slug: node-js
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    http_port: 8080
    health_check:
      http_path: /api/health
    routes:
      - path: /
    envs:
      # ---- Frontend (baked into the client build) ----
      - key: VITE_API_BASE
        scope: BUILD_TIME
        value: ""
      - key: VITE_PHONE
        scope: BUILD_TIME
        value: "+7 700 000 00 00"
      - key: VITE_TELEGRAM
        scope: BUILD_TIME
        value: "CLICKI_App"
      - key: VITE_EMAIL
        scope: BUILD_TIME
        value: "info@clicki-platform.com"
      - key: VITE_RECAPTCHA_SITE_KEY
        scope: BUILD_TIME
        value: ""
      # ---- Backend (runtime) ----
      - key: ADMIN_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: change-me-please
      - key: TELEGRAM_BOT_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: TELEGRAM_CHAT_ID
        scope: RUN_TIME
        value: ""
      - key: MAIL_TO
        scope: RUN_TIME
        value: ""
      - key: SMTP_HOST
        scope: RUN_TIME
        value: ""
      - key: SMTP_PORT
        scope: RUN_TIME
        value: "587"
      - key: SMTP_USER
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: SMTP_PASS
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: RECAPTCHA_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ""
