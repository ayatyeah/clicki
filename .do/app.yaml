# DigitalOcean App Platform spec — CLICKI (single service)
# One Node web service builds the React client and serves it + the API.
# DO auto-detects this file when creating an app from the repo.
#
# ─────────────────────────────────────────────────────────────────────────
#  НЕ ПЕРЕНОСИТЕ deploy/Dockerfile В КОРЕНЬ РЕПОЗИТОРИЯ.
#  App Platform сканирует корень при каждом деплое. Найдя там `Dockerfile`,
#  он перестаёт использовать buildpack (`environment_slug: node-js` +
#  build_command/run_command ниже) и молча переключается на Docker-сборку.
#  Это изменило бы способ сборки боевого сайта на первом же push в main.
#  Docker-обвязка для дроплета живёт в deploy/ именно поэтому — см.
#  deploy/README.md.
# ─────────────────────────────────────────────────────────────────────────
name: clicki
region: fra

services:
  - name: clicki
    github:
      repo: ayatyeah/clicki
      branch: main
      deploy_on_push: true
    # Root of the repo — root package.json build/start orchestrate client+server
    build_command: npm run build
    run_command: npm start
    environment_slug: node-js
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    http_port: 8080
    health_check:
      http_path: /api/health
    routes:
      - path: /
    envs:
      # ---- Frontend (baked into the client build) ----
      - key: VITE_API_BASE
        scope: BUILD_TIME
        value: ""
      - key: VITE_PHONE
        scope: BUILD_TIME
        value: "+7 700 000 00 00"
      - key: VITE_TELEGRAM
        scope: BUILD_TIME
        value: "CLICKI_App"
      - key: VITE_EMAIL
        scope: BUILD_TIME
        value: "info@clicki-platform.com"
      - key: VITE_RECAPTCHA_SITE_KEY
        scope: BUILD_TIME
        value: ""
      # ---- Backend (runtime) ----
      # Database (PostgreSQL, Railway) — REQUIRED. Already set for real in the
      # DO dashboard for this app; value is empty here (SECRET, stored
      # encrypted in the dashboard, not in this file) so a from-scratch
      # redeploy doesn't silently forget the var exists. Do NOT let a spec
      # re-apply overwrite the real value with this placeholder.
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_IN_DO_DASHBOARD
      # TLS до Railway Postgres — сертификат самоподписанный, ставим require
      # (см. server/src/dbConfig.js). На дроплете в deploy/docker-compose.yml
      # стоит DB_SSL=disable, потому что там Postgres в соседнем контейнере и
      # работает без TLS.
      - key: DB_SSL
        scope: RUN_TIME
        value: "require"
      # ADMIN_USER/PASS/TOKEN: without these set, the server falls back to
      # admin/admin/change-me-please (see server/src/index.js). Set real
      # values in the DigitalOcean dashboard (App > Settings > Environment
      # Variables) — do NOT commit real secrets into this file.
      - key: ADMIN_USER
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_IN_DO_DASHBOARD
      - key: ADMIN_PASS
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_IN_DO_DASHBOARD
      # Break-glass / automation token. Admin logins now mint a random, expiring
      # session token instead of handing this to the browser.
      - key: ADMIN_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_IN_DO_DASHBOARD
      # Content-Security-Policy: enforce | report-only | off. The allowlist lives
      # in server/src/security.js. If a newly added third-party tag gets blocked,
      # set report-only, read the browser console, add the host, switch back.
      - key: CSP_MODE
        scope: RUN_TIME
        value: "enforce"
      - key: TELEGRAM_BOT_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: TELEGRAM_CHAT_ID
        scope: RUN_TIME
        value: ""
      - key: MAIL_TO
        scope: RUN_TIME
        value: ""
      - key: SMTP_HOST
        scope: RUN_TIME
        value: ""
      - key: SMTP_PORT
        scope: RUN_TIME
        value: "587"
      - key: SMTP_USER
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: SMTP_PASS
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: RECAPTCHA_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ""
      # TikTok Login Kit + Display API — auto-syncs view counts instead of an
      # operator typing them in. Leave all three empty/placeholder to keep the
      # feature disabled (server checks all three are set before enabling it).
      - key: TIKTOK_CLIENT_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_IN_DO_DASHBOARD
      - key: TIKTOK_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_IN_DO_DASHBOARD
      # Must exactly match a redirect URI registered for the app on
      # developers.tiktok.com (static, https, no query string).
      - key: TIKTOK_REDIRECT_URI
        scope: RUN_TIME
        value: https://clicki-platform.com/api/auth/tiktok/callback
      # Google Sign-In (test page /google-test). OAuth 2.0 Web client ID from
      # Google Cloud Console; the client SECRET is not used by this flow.
      # Empty = the feature is disabled. Set the real value in the DO dashboard.
      - key: GOOGLE_CLIENT_ID
        scope: RUN_TIME
        value: ""
